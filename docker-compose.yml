services:
  api:
    build: .
    image: task-manager-api
    ports:
      - "8001:8000"
    volumes:
      - db-data:/app/data
    environment:
      - APP_PROFILE=dev
      - REDIS_URL=redis://redis:6379
      - CACHE_TTL=${CACHE_TTL:-60}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db-data:
